<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8" />
	<title>Insert title here</title>
</head>

<body layout:fragment="content">
	<form class="mt-5" th:action="update" method="post" th:object="${employee}">
		<div class="container p-3 border">
			<h1 class="text-center pb-3">Update Employee</h1>

			<div class="row pb-2 d-flex justify-content-around">
			
				<div class="col-3">
					<label for="id" class="form-lable">ID Employee</label>
					<input readonly="readonly" type="text" th:field="*{employeeID}" class="form-control">
					<div class="error-message text-danger pt-1"></div>
				</div>
			
				<div class="col-3">
					<label for="name" class="form-lable">Your Name</label>
					<input type="text" th:field="*{name}" id="name" class="form-control" placeholder="Your Name">
					<div class="error-message text-danger pt-1"></div>
				</div>
				
				<div class="col-3">
					<label for="CCCD" class="form-lable">Identification Number</label>
					<input type="text" th:field="*{cccd}" id="CCCD" class="form-control" placeholder="Identification Number">
					<div class="error-message text-danger pt-1"></div>
				</div>

			</div>

			<div class="row pb-2 d-flex justify-content-around">		
				<div class="col-3">
					<label for="duty" class="form-lable">Duty</label>
					<select id="duty" th:field="*{duty}" class="form-control" required>
						<option hidden disabled selected value="">
							Choose Duty
						</option>
						<option value="Manager">Manager</option>
						<option value="Employee">Employee</option>
					</select>
					<div class="error-message text-danger pt-1"></div>
				</div>
			
				<div class="col-3">
					<label for="Office" class="form-lable">Office</label>
					<select id="Office" th:field="*{office}" class="form-control" required>
						<option hidden disabled selected value="">
							Choose a subordinate office
						</option>
						<option value="Services">Services</option>
						<option value="Engineering">Engineering</option>
						<option value="Environment">Environment</option>
					</select>
					<div class="error-message text-danger pt-1"></div>
				</div>

				<div class="col-3">
					<label for="SDT" class="form-lable">Phone Number</label>
					<input type="text" th:field="*{phoneNumber}" id="SDT" class="form-control" placeholder="09774054898">
					<div class="error-message text-danger pt-1"></div>
				</div>
				
			</div>

			<div class="row pb-2 d-flex justify-content-around">
				<div class="col-3">
					<label for="dateOfBirth" class="form-lable ">Date Of Birth</label>
					<input type="date" th:field="*{dateOfBirth}" th:value="*{dateOfBirth}" id="dateOfBirth" class="form-control" placeholder="Date Of Birth">
					<div class="error-message text-danger pt-1"></div>
				</div>
			
				<div class="col-7">
					<label for="Born" class="form-lable">Place of birth</label>
					<input type="text" th:field="*{areaBorn}" id="Born" class="form-control" placeholder="Place of birth">
					<div class="error-message text-danger pt-1"></div>
				</div>
			</div>

			<div class="row pb-2 d-flex justify-content-around">
			
				<div class="col-11">
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="radio" name="gender" id="genderMale" th:field="*{gender}" th:value="MALE">
						<label class="form-check-label" for="genderMale">
							Male
						</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="radio" name="gender" id="genderFemale" th:field="*{gender}" th:value="FEMALE">
						<label class="form-check-label" for="genderFemale">
							Female
						</label>
					</div>
					<div class="error-message text-danger pt-1"></div>
				</div>

			</div>


			<div class="d-flex justify-content-end">
				<button class="btn btn-success col-2" type="submit">
					Create
				</button>
				<button class="btn btn-secondary col-2 ml-2" type="reset">
					Cancel
				</button>
			</div>
		
		</div>
	</form>
</body>

</html>
