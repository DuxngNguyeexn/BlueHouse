<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="../lib/css/bootstrap.min.css">
<link rel="stylesheet"
	href="../fontawesome-free-6.5.2-web/css/all.min.css">
</head>
<body>
	<form action="/addrenspacon" class="mt-5" method="post">
		<div class="container p-3 border">
			<h1 class="text-center pb-5">Create Rental Space Contract</h1>
			<div class="row">
				<div class="col-3 ">
					<label for="idresident" class="form-lable">ID Contract code</label>
					<p id="erroid"></p>
					<input type="text" name="idresident" id="idresident"
						class="form-control" placeholder="ID Resident"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>

				<div class=" col-6">
					<label for="nameresident" class="form-lable">Tenant_code</label>
					<p id="erroname"></p>
					<input type="text" name="nameresident" id="nameresident"
						class="form-control" placeholder="Name Resident"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>
			</div>
			<div class="row">
				<div class="col-6">
					<label for="idresident" class="form-lable ">Move_in_date</label>
					<p id="errobirthday"></p>
					<input type="date" name="idresident" id="idresident"
						class="form-control" placeholder="Birth Day" aria-label="Username"
						aria-describedby="addon-wrapping">
				</div>

				<div class="col-6">
					<label for="idresident" class="form-lable ">Move_out_date</label>
					<p id="errobirthday"></p>
					<input type="date" name="idresident" id="idresident"
						class="form-control" placeholder="Birth Day" aria-label="Username"
						aria-describedby="addon-wrapping">
				</div>
				<div class=" col-6">
					<label for="nameresident" class="form-lable">Duration</label>
					<p id="erroidentificard"></p>
					<input type="time" name="nameresident" id="nameresident"
						class="form-control" placeholder="Identifi Card"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>
				<div class=" col-6">
					<label for="nameresident" class="form-lable">ID_Apa</label>
					<p id="erroidentificard"></p>
					<input type="text" name="nameresident" id="nameresident"
						class="form-control" placeholder="Identifi Card"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>
				<div class=" col-6">
					<label for="nameresident" class="form-lable">Manager_codeContract</label>
					<p id="erroidentificard"></p>
					<input type="text" name="nameresident" id="nameresident"
						class="form-control" placeholder="Identifi Card"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>
			</div>

			<div class="d-flex justify-content-end">
				<button class="btn btn-primary btn-lg col-2" type="submit">Create
				</button>
				<button class="btn btn-secondary btn-lg col-2 ml-2" type="reset">Cancel
				</button>
			</div>
		</div>
	</form>
</body>
</html>
