<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8" />
	<title>List Notification</title>
	<link rel="stylesheet" th:href="@{/account/css/list.css}" />
</head>

<body layout:fragment="content">
	<div class="m-5 mt-4">
		<div class="h1 text-center mb-4">
			List Event
		</div>

		<div class="text-center d-flex justify-content-between">
			<form class="col-3">
				<div class="input-group">
					<input class="form-control search" placeholder="Search" name="searchKeyword" />
					<button class="input-group-text search-icon" type="submit">
						<i class="fa-solid fa-magnifying-glass"></i>
					</button>
				</div>
			</form>

			<a href="add">
				<button type="button" class="btn btn-info">+ New Event</button>
			</a>
		</div>

		<div class="table-responsive tableFixHead border-right border-left border-bottom mt-3">
			<table class="table">
				<thead class="thead-dark">
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Start Day</th>
						<th scope="col">Start Time</th>
						<th scope="col">End Day</th>
						<th scope="col">End Time</th>
						<th scope="col">Location</th>
						<th scope="col">Count Participant</th>
						
						<th scope="col">Action</th>
					</tr>
				</thead>
				<tbody th:each="event : ${listEvent}">
					<tr>
						<td th:text="${event.nameEvent}"></td>
						<td th:text="${event.startDate}"></td>
						<td th:text="${event.startTime}"></td>
						<td th:text="${event.endDate}"></td>
						<td th:text="${event.endTime}"></td>
						<td th:text="${event.location}"></td>
						<td th:text="${event.numberOfParticipants}"></td>
						
						<td>
							<a th:data-value="${event.idEvent}" onclick="window.location.href='IDEvent='+this.dataset.value;" class="text-decoration-none mr-2">
								<i class="fa-solid fa-eye pencil"></i>
							</a>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div th:replace="@{layout/page} :: pageAble"></div>
	</div>

	<script th:src="@{/account/js/list.js}"></script>
</body>

</html>
