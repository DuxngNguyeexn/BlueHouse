<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8" />
	<title>Account Management</title>
</head>

<body layout:fragment="content">
	<form id="form-data" class="mt-5" th:action="updatePass" method="post" th:object="${account}">
		<div class="container p-3 border">
			<h1 class="text-center pb-3">Change Password</h1>

			<div class="row pb-2 d-flex justify-content-around">
				<div class="col-5">
					<label for="username" class="form-lable">User Name</label>
					<input type="text" th:field="*{username}" id="username" class="form-control" placeholder="User Name" disabled="disabled" />
				</div>

				<div class="col-5">
					<label for="password" class="form-lable">Pass World</label>
					<input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Pass World" />
				</div>
				
			</div>

			<div class="d-flex justify-content-end">
				<button onclick="validate(event)" class="btn btn-primary col-2" type="submit">
					Update
				</button>

				<button onclick="window.location.href='/'" class="btn btn-secondary col-2 ml-2" type="reset">
					Back Home
				</button>
			</div>
		</div>
	</form>

</body>

</html>
