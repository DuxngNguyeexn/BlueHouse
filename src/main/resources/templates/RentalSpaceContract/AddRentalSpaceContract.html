<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="../lib/css/bootstrap.min.css">
<link rel="stylesheet"
	href="../fontawesome-free-6.5.2-web/css/all.min.css">
</head>
<body layout:fragment="content">
	<form th:action="@{/saverentalSpaContracs}" class="mt-5" method="post"
		th:object="${RentalSpa}">
		<div class="container p-3 border">
			<h1 class="text-center pb-3 text-primary">Create Rental Space
				Contract</h1>
			<div class="row">
				<div class="col-6 ">
					<label for="contractCode" class="form-lable">ID Contract
						code</label>
					<input type="text" th:field="*{contractCode}" id="contractCode"
						class="form-control" placeholder="ID Contract"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('contractCode')}"
						th:errors="*{contractCode}" class="text-danger"></div>
				</div>

				<div class=" col-6">
					<label for="tenantCode" class="form-lable">Tenant_code</label>
					<input type="text" th:field="*{tenantCode}" id="tenantCode"
						class="form-control" placeholder="Tenant Code"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('tenantCode')}"
						th:errors="*{tenantCode}" class="text-danger"></div>
				</div>
			</div>
			<div class="row">
				<div class="col-6">
					<label for="moveInDate" class="form-lable ">Move_in_date</label>
					<input type="date" th:field="*{moveInDate}" id="moveInDate"
						class="form-control" placeholder="Move in date"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('moveInDate')}"
						th:errors="*{moveInDate}" class="text-danger"></div>
				</div>

				<div class="col-6">
					<label for="moveOutdate" class="form-lable ">Move_out_date</label>
					<input type="date" th:field="*{moveOutdate}" id="moveOutdate"
						class="form-control" placeholder="Move out date"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('moveOutdate')}"
						th:errors="*{moveOutdate}" class="text-danger"></div>
				</div>
			</div>

			<div class="row mb-3">
				<div class=" col-4">
					<label for="duration" class="form-lable">Duration</label>
					<input type="time" th:field="*{duration}" id="duration"
						class="form-control" placeholder="Duration" aria-label="Username"
						aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('duration')}"
						th:errors="*{duration}" class="text-danger"></div>
				</div>
				<div class="col-4">
					<label for="apartmentNumber" class="form-lable">Apartment
						Number</label> <select th:field="*{idApa}" class="form-control" required>
						<th:block th:each="apartment : ${apartments}">
							<option th:value="${apartment.idApartment}"
								th:text="${apartment.apartmentNumber}"></option>
						</th:block>
					</select>
				</div>
				<div class="col-4">
					<label for="managerCodeContract" class="form-lable">managerCodeContract</label>
					<select th:field="*{managerCodeContract}" class="form-control"
						required>
						<th:block th:each="employee : ${employees}">
							<option th:value="${employee.employeeID}"
								th:text="${employee.name}"></option>
						</th:block>
					</select>
				</div>
			</div>

			<div class="d-flex justify-content-end">
				<button class="btn btn-primary btn-lg col-2" type="submit">Create
				</button>
				<button class="btn btn-secondary btn-lg col-2 ml-2" type="reset">Cancel
				</button>
			</div>
		</div>
	</form>
</body>
</html>
