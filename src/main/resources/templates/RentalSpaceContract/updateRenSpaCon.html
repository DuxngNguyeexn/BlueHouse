<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Create Resident</title>
<link rel="stylesheet" href="../lib/css/bootstrap.min.css">
<link rel="stylesheet"
	href="../fontawesome-free-6.5.2-web/css/all.min.css">
</head>
<body>
	<form action="/saveupdaterenspacon" class="mt-5" method="post"
		th:object="${renspacont}">
		<div class="container p-3 border">
			<h1 class="text-center pb-5">Update RentalSpaCon</h1>
			<div class="row">
				<div class=" col-6">
					<label for="contractCode" class="form-lable">ID Contract</label>
					<p id="errocontractCode"></p>
					<input type="text" th:field="*{contractCode}" id="contractCode"
						class="form-control" placeholder="contractCode"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>

				<div class=" col-6">
					<label for="tenantCode" class="form-lable">Tenant_code</label>
					<p id="errotenantCode"></p>
					<input type="text" th:field="*{tenantCode}" id="tenantCode"
						class="form-control" placeholder="Tenant_code"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>
			</div>
			<div class="row">
				<div class="col-6">
					<label for="moveInDate" class="form-lable ">Move_in_date</label>
					<p id="erromoveInDate"></p>
					<input type="date" th:field="*{moveInDate}" id="moveInDate"
						class="form-control" placeholder="moveInDate"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>

				<div class="col-6">
					<label for="moveOutdate" class="form-lable ">Move_out_date</label>
					<p id="erromoveOutdate"></p>
					<input type="date" th:field="*{moveOutdate}" id="moveOutdate"
						class="form-control" placeholder="moveOutdate"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>

				<div class=" col-6">
					<label for="duration" class="form-lable">Duration</label>
					<p id="erroduration"></p>
					<input type="time" th:field="*{duration}" id="duration"
						class="form-control" placeholder="Identifi Card"
						aria-label="Username" aria-describedby="addon-wrapping">
				</div>
			</div>

			<div class="row pb-3">
				<div class="col-6">
					<label for="idApa" class="form-lable ">ID Apartment</label>
					<p id="erroidapart"></p>
					<select id="idApa" name="idApa" th:field="*{idApa}">
						<option th:each="apartment : ${listapartment}"
							th:value="${apartment.idApa.idApartment}"
							th:text="${apartment.idApa.apartmentNumber}"></option>
					</select>

				</div>

				<div class="col-6">
					<label for="managerCodeContract" class="form-lable ">managerCodeContract</label>
					<p id="erromanagerCodeContract"></p>
					<select id="managerCodeContract" name="managerCodeContract"
						th:field="*{managerCodeContract}">
						<option th:each="employee : ${listapartment}"
							th:value="${employee.managerCodeContract.employeeID}"
							th:text="${employee.managerCodeContract.name}"></option>
					</select>

				</div>
			</div>
			<div class="d-flex justify-content-end">
				<button class="btn btn-primary btn-lg col-2" type="submit">Update
				</button>
				<button class="btn btn-secondary btn-lg col-2 ml-2" type="reset">Cancel
				</button>
			</div>
		</div>
	</form>
</body>
</html>
