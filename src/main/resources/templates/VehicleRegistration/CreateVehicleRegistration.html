<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="../lib/css/bootstrap.min.css">
<link rel="stylesheet"
	href="../fontawesome-free-6.5.2-web/css/all.min.css">
</head>
<body layout:fragment="content">
	<form th:action="@{/saveVehicleRegistration}" class="mt-5" method="post"
		th:object="${vehicleregi}">
		<div class="container p-3 border">
			<h1 class="text-center pb-3 text-primary">Create Vehicle Registration</h1>
			<div class="row">
				<div class="col-6 ">
					<label for="idVehicle" class="form-lable">idVehicle
						code</label>
					<input type="text" th:field="*{idVehicle}" id="idVehicle"
						class="form-control" placeholder="idVehicle"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('idVehicle')}" th:errors="*{idVehicle}" class="text-danger"></div>
				</div>

				<div class=" col-6">
					<label for="vehicleNumber" class="form-lable">vehicleNumber</label>
					<input type="text" th:field="*{vehicleNumber}" id="vehicleNumber"
						class="form-control" placeholder="vehicleNumber"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('vehicleNumber')}" th:errors="*{vehicleNumber}" class="text-danger"></div>
				</div>
			</div>
			<div class="row pb-3">
				<div class="col-6">
					<label for="registrationDate" class="form-lable ">registrationDate</label>
					<input type="date" th:field="*{registrationDate}" id="registrationDate"
						class="form-control" placeholder="registrationDate"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('registrationDate')}" th:errors="*{registrationDate}" class="text-danger"></div>
				</div>

				<div class="col-6">
					<label for="expirationDate" class="form-lable ">expirationDate</label>
					<input type="date" th:field="*{expirationDate}"  id="expirationDate"
						class="form-control" placeholder="expirationDate"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('expirationDate')}" th:errors="*{expirationDate}" class="text-danger"></div>
				</div>
		
				<div class="col-6">
					<label for="apartmentVE" class="form-lable">Apartment Number</label> <select
						th:field="*{apartmentVE}" class="form-control" required>
						<th:block th:each="apartment : ${listapa}">
							<option th:value="${apartment.idApartment}"
								th:text="${apartment.apartmentNumber}"></option>
						</th:block>
					</select>
				</div>
				<div class="col-6">
					<label for="feeTypeCode" class="form-lable">feeTypeCode</label> <select
						th:field="*{feeTypeCode}" class="form-control" required>
						<th:block th:each="feeTypeCode : ${listfee}">
							<option th:value="${feeTypeCode.idFeetype}"
								th:text="${feeTypeCode.nameFeetype}"></option>
						</th:block>
					</select>
				</div>
			</div>

			<div class="d-flex justify-content-end">
				<button class="btn btn-primary btn-lg col-2" type="submit">Create
				</button>
				<button class="btn btn-secondary btn-lg col-2 ml-2" type="reset">Cancel
				</button>
			</div>
		</div>
	</form>
</body>
</html>
