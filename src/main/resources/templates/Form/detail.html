<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/lib/css/bootstrap.min.css}">
</head>

<body layout:fragment="content">
    <div class="text-center h1 mt-2 mb-2">Detail</div>
    <div class="container mt-2">
        <div class="row">
            <div class="col-4 bg-secondary">
                <div class="text-center"><i class="fa-regular fa-user p-3 bg-white mt-3"></i></div>
                <div class="text-center "><i class="fa-solid fa-arrow-down-long mt-3"></i></div>
                <div class="text-center"><i class="fa-solid fa-user-tie p-3 bg-white mt-3"></i></div>
                <div class="text-center"><i class="fa-solid fa-arrow-down-long mt-3"></i></div>
                <div class="text-center"><i class="fa-solid fa-wrench p-3 bg-white mt-3"></i></div>
                <div class="d-flex justify-content-center w-75 m-auto">
                    <div><i class="fa-solid fa-arrow-down-long mt-3"></i></div>
                </div>
                <div class="d-flex justify-content-between w-75 m-auto">
                    <div><i class="fa-regular fa-newspaper p-3 bg-white mt-3"></i></div>
                    <div class=""><i class="fa-solid fa-arrow-left-long mt-3"></i></div>
                    <div class="align-content-end"><i class="fa-solid fa-arrow-right-long mt-3"></i></div>
                    <div><i class="fa-regular fa-newspaper p-3 bg-white mt-3"></i></div>
                </div>
            </div>
            <div class="col-8 ">
                <div class="text-center h3">Detail</div>
                <div class="ml-4 mb-4"><span class="h5">Resident: </span> <span
                        th:text="${form.resident.idResident} + ' - ' + ${form.resident.nameResident}"></span></div>
                <div class="ml-4 mb-4"><span class="h5">Manager: </span> <span th:if="${form.employee != null}"
                        th:text="${form.employee.employeeID} + ' - ' + ${form.employee.name}"></span> </div>
                <div class="ml-4 mb-4"><span class="h5">Employee: </span> </div>
                <div class="ml-4 mb-4"><span class="h5">Date sent: </span> <span th:text="${form.dateSent}"></span>
                </div>
                <div class="ml-4 mb-4"><span class="h5">Note: </span> <span th:text="${form.note}"></span></div>
                <div class="ml-4 mb-4 h5 ">Status: <span th:text="${form.status}"></span> </div>
                <div class="w-50 d-flex float-right ">
                    <a href="#" class="btn btn-danger w-100 mr-2 mr-0">Deny</a>
                    <a href="#" class="btn btn-success w-100 mr-2">Accept</a>
                    <a href="#" class="btn btn-secondary w-100">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
