<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="../lib/css/bootstrap.min.css">
<link rel="stylesheet"
	href="../fontawesome-free-6.5.2-web/css/all.min.css">
</head>
<body layout:fragment="content">
	<form th:action="@{/saveRegisterForResidence}" class="mt-5" method="post"
		th:object="${registesresi}">
		<div class="container p-3 border">
			<h1 class="text-center pb-3">Create Register For Residence</h1>
			<div class="row pb-2">
				<div class="col-3 ">
					<label for="contractCode" class="form-lable">ID Residence </label>
					<input type="text" th:field="*{idResidence}" id="idResidence"
						class="form-control" placeholder="ID Residence"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('idResidence')}" th:errors="*{idResidence}" class="text-danger"></div>
				</div>

				<div class=" col-3">
					<label for="relationshipWithHomeowner" class="form-lable">RelationshipWithHomeowner</label>
					<input type="text" th:field="*{relationshipWithHomeowner}" id="relationshipWithHomeowner"
						class="form-control" placeholder="relationshipWithHomeowner"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('relationshipWithHomeowner')}" th:errors="*{relationshipWithHomeowner}" class="text-danger"></div>
				</div>
				<div class=" col-3">
					<label for="type" class="form-lable">type</label>
					<input type="text" th:field="*{type}" id="type"
						class="form-control" placeholder="type"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="text-danger"></div>
				</div>
			</div>
			<div class="row pb-2">
				<div class="col-3">
					<label for="dateOfBirth" class="form-lable ">dateOfBirth</label>
					<input type="date" th:field="*{dateOfBirth}" id="dateOfBirth"
						class="form-control" placeholder="dateOfBirth"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="text-danger"></div>
				</div>
				
				<div class="col-3">
					<label for="moveOutdate" class="form-lable ">moveInDate</label>
					<input type="date" th:field="*{moveInDate}" id="moveInDate"
						class="form-control" placeholder="moveInDate"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('moveInDate')}" th:errors="*{moveInDate}" class="text-danger"></div>
				</div>
				
				<div class="col-3">
					<label for="moveOutDate" class="form-lable ">moveOutDate</label>
					<input type="date" th:field="*{moveOutDate}" id="moveOutDate"
						class="form-control" placeholder="moveOutDate"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('moveOutDate')}" th:errors="*{moveOutDate}" class="text-danger"></div>
				</div>
			</div>
			<div class="row pb-2">
				<div class=" col-3">
					<label for="phone" class="form-lable">phone</label>
					<input type="text" th:field="*{phone}" id="phone"
						class="form-control" placeholder="phone"
						aria-label="Username" aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></div>
				</div>
				<div class=" col-3">
					<label for="idNational" class="form-lable">idNational</label>
					<input type="text" name="idNational" id="idNational"
						class="form-control" placeholder="idNational" aria-label="Username"
						aria-describedby="addon-wrapping">
					<div th:if="${#fields.hasErrors('idNational')}" th:errors="*{idNational}" class="text-danger"></div>
				</div>
				<div class="col-3">
					<label for="idApartmentResi" class="form-lable">idApartmentResi</label> <select
						th:field="*{idApartmentResi}" class="form-control" required>
						<th:block th:each="apartment : ${listapa}">
							<option th:value="${apartment.idApartment}"
								th:text="${apartment.apartmentNumber}"></option>
						</th:block>
					</select>
				</div>
				<div class="col-3">
					<label for="idResidentResi" class="form-lable">idResidentResi</label> <select
						th:field="*{idResidentResi}" class="form-control" required>
						<th:block th:each="resident : ${listresi}">
							<option th:value="${resident.idResident}"
								th:text="${resident.nameResident}"></option>
						</th:block>
					</select>
				</div>
			</div>

			<div class="d-flex justify-content-end">
				<button class="btn btn-primary btn-lg col-2" type="submit">Create
				</button>
				<button class="btn btn-secondary btn-lg col-2 ml-2" type="reset">Cancel
				</button>
			</div>
		</div>
	</form>
</body>
</html>
